<svg viewBox="0 0 1584 396" width="1584" height="396" xmlns="http://www.w3.org/2000/svg">
  <rect width="1584" height="396" fill="#0A0612"/>
  
  <defs>
    <radialGradient id="glowP" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0A0612" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="85%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0A0612" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1584" height="396" fill="url(#grid)"/>
  <rect width="1584" height="396" fill="url(#glowP)"/>
  <rect width="1584" height="396" fill="url(#glowC)"/>

  <!-- Left Side Profile Picture Safe Zone Ring -->
  <circle cx="160" cy="270" r="110" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Main Headline (No Name - Focus on Engineering & Stack) -->
  <g transform="translate(420, 75)">
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" letter-spacing="-0.02em">
      SOFTWARE DEVELOPMENT ENGINEER
    </text>
    <text x="0" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="700" fill="url(#textGrad)" letter-spacing="0.04em">
      DISTRIBUTED BACKEND SYSTEMS · APPLIED MACHINE LEARNING · RAG
    </text>
    <text x="0" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94A3B8">
      High-throughput Java/Python services, compliance infrastructure, and multimodal AI architectures.
    </text>
  </g>

  <!-- 3 Impact Highlight Cards -->
  <g transform="translate(420, 230)">
    <!-- Card 1: Amazon Alexa -->
    <g transform="translate(0, 0)">
      <rect width="340" height="98" rx="18" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
      <text x="24" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22">🛡️</text>
      <text x="62" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Amazon SDE</text>
      <text x="62" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#34D399">50M+ Alexa Users DSAR</text>
      <text x="62" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Zero downtime JDK 17 rollouts</text>
    </g>

    <!-- Card 2: IEEE ICCDS 2025 -->
    <g transform="translate(360, 0)">
      <rect width="360" height="98" rx="18" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
      <text x="24" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22">🏆</text>
      <text x="62" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">IEEE ICCDS 2025</text>
      <text x="62" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#F472B6">First Author Paper · 0.99 AUC</text>
      <text x="62" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">SHAP multimodal fusion pipeline</text>
    </g>

    <!-- Card 3: Springer Nature -->
    <g transform="translate(740, 0)">
      <rect width="380" height="98" rx="18" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
      <text x="24" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22">📊</text>
      <text x="62" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Springer Nature</text>
      <text x="62" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#38BDF8">Published Research Study</text>
      <text x="62" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Ethnic disparities in ASD analytics</text>
    </g>
  </g>

  <!-- Top Right Live Portfolio Badge -->
  <g transform="translate(1320, 40)">
    <rect width="210" height="42" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <circle cx="24" cy="21" r="5" fill="#34D399"/>
    <text x="38" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="bold" fill="#FCE7F3">deevna-portfolio.vercel.app</text>
  </g>
</svg>
